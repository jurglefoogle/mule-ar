<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Mule AR Preview</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --bg: #111; --fg: #f2f2f2; --dim: #9a9a9a; --accent: #f28c28; --panel: rgba(20, 20, 20, 0.86); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  button, select, label.file { font: inherit; color: var(--fg); background: #2a2a2a; border: 1px solid #444;
               border-radius: 10px; padding: 10px 14px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 700; }
  button:disabled { opacity: 0.45; }
  .hidden { display: none !important; }

  #preview { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #home { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
          background: linear-gradient(transparent, rgba(0,0,0,0.85) 30%); }
  #home h1 { margin: 0; font-size: 22px; letter-spacing: 0.04em; }
  #home p { margin: 4px 0 12px; color: var(--dim); font-size: 14px; }
  #support { color: var(--accent); font-size: 14px; margin: 8px 0 0; }

  .ads { display: grid; gap: 8px; }
  .ads .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .ads select { flex: 1 1 160px; min-width: 0; }
  label.file { display: inline-block; cursor: pointer; font-size: 14px; }
  label.file input { display: none; }
  .check { font-size: 14px; color: var(--dim); display: flex; gap: 8px; align-items: center; }
  .start { display: flex; gap: 8px; margin-top: 12px; }
  .start button { flex: 1; padding: 14px; font-size: 18px; }

  /* AR overlay (shown over the camera) */
  #ar { position: fixed; inset: 0; pointer-events: auto; touch-action: none; }
  #hint { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
          background: var(--panel); padding: 8px 14px; border-radius: 20px; font-size: 15px; white-space: nowrap; }
  #arbar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around; align-items: center;
           padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); }
  #arbar button { background: var(--panel); border-color: #555; min-width: 64px; }
  #snap { width: 74px; height: 74px; border-radius: 50%; background: #fff !important; border: 5px solid rgba(255,255,255,0.4) !important;
          background-clip: padding-box !important; min-width: 0 !important; }
  #exit { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 10px; background: var(--panel); }
  #adsheet { position: absolute; left: 8px; right: 8px; bottom: calc(110px + env(safe-area-inset-bottom));
             background: var(--panel); border-radius: 14px; padding: 12px; }
  #log { position: fixed; left: 6px; right: 6px; top: calc(56px + env(safe-area-inset-top)); max-height: 30vh; overflow: auto;
         margin: 0; padding: 6px 8px; font: 11px/1.3 ui-monospace, monospace; white-space: pre-wrap;
         background: rgba(0,0,0,0.7); color: #9f9; border-radius: 8px; pointer-events: none; z-index: 5; }
  #adsheet .light { display: flex; gap: 10px; align-items: center; margin-top: 10px; font-size: 14px; color: var(--dim); }
  #adsheet .light input { flex: 1; accent-color: var(--accent); }
  #adsheet .light button { padding: 6px 12px; font-size: 14px; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.25s; }

  /* result */
  #result { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; }
  #result img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
  #result .bar { display: flex; gap: 8px; padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); }
  #result .bar button { flex: 1; padding: 14px; }
  #toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); background: var(--panel);
           padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: 90vw; text-align: center; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="preview"></canvas>

<section id="home">
  <h1>THE MULE &middot; AR PREVIEW</h1>
  <p>Place a life-size Mule on site, put the client's ad on it, and send them a photo.</p>
  <div class="ads" id="adsHome"></div>
  <div class="start">
    <button id="startAR" class="primary" disabled>Checking AR&hellip;</button>
  </div>
  <p id="support" class="hidden"></p>
</section>

<section id="ar" class="hidden">
  <div id="hint">Point the phone at the ground and move it slowly</div>
  <button id="exit">&times;</button>
  <div id="adsheet" class="hidden">
    <div class="ads" id="adsAR"></div>
    <div class="row light">
      <label for="bright">Sign brightness</label>
      <input type="range" id="bright" min="0.3" max="2" step="0.05" value="1">
      <button id="brightReset">Reset</button>
    </div>
  </div>
  <div id="arbar">
    <button id="move">Move</button>
    <button id="adsBtn">Adjust</button>
    <button id="snap" aria-label="Take photo"></button>
    <button id="face">Face me</button>
    <button id="strip">Info: on</button>
  </div>
  <div id="flash"></div>
</section>

<section id="result" class="hidden">
  <img id="shot" alt="Mule preview photo">
  <div class="bar">
    <button id="back">Back</button>
    <button id="save">Save</button>
    <button id="share" class="primary">Share</button>
  </div>
</section>

<div id="toast" class="hidden"></div>
<pre id="log" class="hidden"></pre>

<template id="adsTemplate">
  <div class="row">
    <select data-role="campaign" aria-label="Sample ad"></select>
    <select data-role="faces" aria-label="Which faces">
      <option value="both">Both faces</option>
      <option value="Front">Front only</option>
      <option value="Back">Back only</option>
    </select>
  </div>
  <div class="row">
    <label class="file">Client top ad&hellip;<input type="file" accept="image/*" data-role="top"></label>
    <label class="file">Client bottom ad&hellip;<input type="file" accept="image/*" data-role="bottom"></label>
  </div>
</template>

<script type="module" src="app.js"></script>
</body>
</html>
